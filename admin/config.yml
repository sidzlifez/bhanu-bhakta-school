backend:
  name: git-gateway
  branch: main

media_library:
  name: cloudinary
  config:
    cloud_name: "YOUR_CLOUDINARY_CLOUD_NAME"
    api_key: "YOUR_CLOUDINARY_API_KEY"

media_folder: "images"
public_folder: "/images"
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "notices"
    label: "School Notices & Events"
    files:
      - name: "notices_feed"
        label: "Noticeboard Feed"
        file: "content/notices.json"
        fields:
          - label: "Notice Items"
            name: "items"
            widget: "list"
            fields:
              - label: "Notice Title"
                name: "title"
                widget: "string"
              - label: "Posting Date"
                name: "date"
                widget: "string"
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Exam & Results"
                  - "School Events"
                  - "Holiday Notice"
                  - "Parent-Teacher Meeting"
                  - "Admissions & Scholarships"
              - label: "Pin as Important / Urgent"
                name: "important"
                widget: "boolean"
                default: false
                required: false
              - label: "Event Date / Time Note"
                name: "eventDate"
                widget: "string"
                required: false
              - label: "Summary / Details"
                name: "summary"
                widget: "text"
              - label: "Attachment / Circular PDF"
                name: "attachment"
                widget: "file"
                required: false

  - name: "gallery"
    label: "Photo Gallery"
    files:
      - name: "gallery_albums"
        label: "Event Photo Albums"
        file: "content/gallery.json"
        fields:
          - label: "Photo Albums"
            name: "albums"
            widget: "list"
            fields:
              - label: "Photo Title"
                name: "title"
                widget: "string"
              - label: "Event Category (Type any category)"
                name: "category"
                widget: "string"
                default: "School Foundation & Bhanu Jayanti Events"
                hint: "Default categories: School Foundation & Bhanu Jayanti Events, Annual Sports, National Celebrations, Teachers' Day & Children's Day, Student Programmes, Campus & Classroom Life"
              - label: "Year / Date"
                name: "date"
                widget: "string"
              - label: "Photo Description"
                name: "description"
                widget: "text"
                required: false
              - label: "Photo Image"
                name: "image"
                widget: "image"

  - name: "staff"
    label: "About & Staff Directory"
    files:
      - name: "staff_directory"
        label: "Faculty & History Photos"
        file: "content/staff.json"
        fields:
          - label: "Historic Campus Photo (Est. 1962)"
            name: "oldPhoto"
            widget: "image"
            required: false
          - label: "Present Campus Photo"
            name: "newPhoto"
            widget: "image"
            required: false
          - label: "Teaching Staff List"
            name: "teachers"
            widget: "list"
            fields:
              - label: "Full Name"
                name: "name"
                widget: "string"
              - label: "Designation"
                name: "designation"
                widget: "string"
              - label: "Subject Taught"
                name: "subject"
                widget: "string"
              - label: "Teacher Photo"
                name: "photo"
                widget: "image"
                required: false
          - label: "Managing Committee"
            name: "committee"
            widget: "list"
            fields:
              - label: "Member Name"
                name: "name"
                widget: "string"
              - label: "Role / Title"
                name: "role"
                widget: "string"

  - name: "academics"
    label: "Academics & Syllabus PDFs"
    files:
      - name: "academics_docs"
        label: "Syllabus & Routine Documents"
        file: "content/academics.json"
        fields:
          - label: "Documents List"
            name: "documents"
            widget: "list"
            fields:
              - label: "Wing"
                name: "wing"
                widget: "select"
                options:
                  - "pre-primary"
                  - "primary"
                  - "upper-primary"
                  - "secondary"
              - label: "Type"
                name: "type"
                widget: "select"
                options:
                  - "Syllabus"
                  - "Routine"
              - label: "Document Title"
                name: "title"
                widget: "string"
              - label: "Session / Year"
                name: "updated"
                widget: "string"
              - label: "PDF File Upload"
                name: "file"
                widget: "file"

  - name: "results"
    label: "Student Marksheets"
    files:
      - name: "results_records"
        label: "Online Result Records"
        file: "content/results.json"
        fields:
          - label: "Student Result Records"
            name: "results"
            widget: "list"
            fields:
              - label: "Class"
                name: "className"
                widget: "select"
                options:
                  - "Nursery"
                  - "KG"
                  - "Class I"
                  - "Class II"
                  - "Class III"
                  - "Class IV"
                  - "Class V"
                  - "Class VI"
                  - "Class VII"
                  - "Class VIII"
                  - "Class IX"
                  - "Class X"
              - label: "Roll Number"
                name: "roll"
                widget: "string"
              - label: "Student Full Name"
                name: "name"
                widget: "string"
              - label: "Exam Title"
                name: "examTitle"
                widget: "string"
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - "PASSED"
                  - "PROMOTED"
                  - "COMPARTMENTAL"
              - label: "Subjects & Marks"
                name: "subjects"
                widget: "list"
                fields:
                  - label: "Subject Name"
                    name: "name"
                    widget: "string"
                  - label: "Full Marks"
                    name: "fullMarks"
                    widget: "number"
                  - label: "Marks Obtained"
                    name: "marksObtained"
                    widget: "number"
